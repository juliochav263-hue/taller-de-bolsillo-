</style></head><body><nav><div class="wrap"><a class="brand" href="../"><i aria-hidden="true">TB</i>Taller de Bolsillo</a></div></nav><main class="tool"><a href="../">Volver al buscador de rubros</a><h1>¿A cuánto vendo si me cobran comisión?</h1><p>Para Mercado Libre, Mercado Pago, apps de delivery o donde se queden con un porcentaje: te dice el precio mínimo para no perder.</p><form class="card"><div class="fields"><label>Lo que te sale cada cosa ($)<input type="number" min="0" max="1000000000" step="any" required value="3500"></label><label>Cargo fijo que te cobran por venta ($)<input type="number" min="0" max="1000000000" step="any" required value="400"></label><label>Comisión que te cobran (%)<input type="number" min="0" max="1000000000" step="any" required value="12"></label><label>Cuánto querés ganar (% del precio)<input type="number" min="0" max="1000000000" step="any" required value="25"></label></div><div class="result" role="status"><strong id="result"></strong><p id="detail"></p></div></form><p class="status">Los datos quedan en tu navegador.</p></main><script>
const form=document.querySelector('form');
const title=document.querySelector('#result');
const detail=document.querySelector('#detail');
const money=value=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(value);
const number=value=>new Intl.NumberFormat('es-AR',{maximumFractionDigits:2}).format(value);
function calculate(values) { const [cost,fixed,commission,margin]=values;
if (commission+margin>=100) return ['La comisión más lo que querés ganar tiene que dar menos de 100%.',''];
const target=Math.ceil(((cost+fixed)/(1-(commission+margin)/100))*100-1e-8)/100;
return ['Cobrá como mínimo '+money(target), 'Si te cobran algo más (envío, cuotas), sumalo a lo que te sale cada cosa.']; }
function update(){
 const result=form.checkValidity()?calculate([...form.querySelectorAll('input')].map(input=>input.valueAsNumber)):['Completá todos los valores con números válidos.',''];
 title.textContent=result[0];detail.textContent=result[1];
}
form.addEventListener('input',update);
form.addEventListener('submit',event=>event.preventDefault());
update();
</script></body></html>
